baseURL: "https://Sayadbayezid.github.io/Tech-Era/"
languageCode: "en-us"
title: "Sayad md Bayezid Hosan"
theme: hugo-profile

# Multilingual configuration
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    contentDir: "content"
    menu:
      main:
        - identifier: blog
          name: Blog
          title: Blog posts
          url: /blogs
          weight: 1
        - identifier: gallery
          name: Gallery
          title: Image gallery
          url: /gallery
          weight: 2

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  title: "Sayad md Bayezid Hosan"
  description: "Full-stack Web Developer, Digital Marketer & Tech Provider"
  favicon: "/fav.png"
  useBootstrapCDN: false
  mathjax: false
  animate: true

  navbar:
    align: ms-auto
    brandName: "Bayezid"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Sayad md Bayezid Hosan."
    subtitle: "Full-stack Web Developer & Tech Provider"
    content: "Founder of Connect with Bayezid and GenZ Frontier, specializing in innovative digital ecosystem solutions and AI integration. Based in Bangladesh with 5+ years of experience."
    image: /images/hero.svg
    bottomImage:
      enable: true
    button:
      enable: true
      name: "Get in Touch"
      url: "#contact"
      download: false
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/Sayadbayezid
        - icon: fab fa-linkedin
          url: https://linkedin.com/in/sayadbayezid
        - icon: fab fa-facebook
          url: https://facebook.com/sayadbayezid

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.png"
    content: |-
      As a Full-stack Web Developer, Digital Marketer, and Web Designer, I have built a reputation for delivering innovative digital solutions with 5+ years of experience. My expertise spans the entire digital ecosystem, from web development and AI integration to strategic digital marketing and tech entrepreneurship.

      I am dedicated to helping my audience navigate digital platforms safely and efficiently by combining academic knowledge with practical technical innovation.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "React"
        - "Node.js"
        - "JavaScript"
        - "Digital Marketing"
        - "AI Integration"
        - "Web Design"

  # Experience
  experience:
    enable: true
    items:
      - company: "Connect with Bayezid"
        companyUrl: "https://sayadbayezid.com"
        jobs:
          - name: "Founder & Tech Provider"
            date: "2019 - present"
            content: "Leading tech provider specializing in permission-based technical solutions and managing digital business assets. Delivered 2,200+ happy clients worldwide with a 98% retention rate."
      - company: "GenZ Frontier"
        companyUrl: "https://sayadbayezid.com"
        jobs:
          - name: "Founder"
            date: "2021 - present"
            content: "Digital newsportal for modern generation insights and tech trends."

  # Education
  education:
    enable: true
    items:
      - title: "Undergraduate Student (English)"
        school:
          name: "Northern University Bangladesh"
          url: "https://nub.ac.bd"
        date: "Expected Graduation: June 2026"
        content: "Department of English"

  # Achievements
  achievements:
    enable: true
    items:
      - title: "Digital Marketing Mastery"
        content: "Professional certification in advanced digital marketing strategies, including SEO and content marketing."
        image: /images/achievement.jpg
      - title: "Meta Certified Advertiser"
        content: "Professional certification from Meta demonstrating expertise in Facebook and Instagram advertising."
        image: /images/achievement.jpg
      - title: "AI-Powered Design Innovation"
        content: "Certified in leveraging artificial intelligence within Canva to create smarter designs."
        image: /images/achievement.jpg

  # projects
  projects:
    enable: true
    items:
      - title: "AI WhatsApp Automation"
        content: "A full-fledged 24/7 AI customer service system for a Fijian client. Automates orders and processes messages."
        image: /images/projects/profile.png
        badges:
          - "AI Chatbot"
          - "WhatsApp API"
      - title: "SmartGen QR Code Generator"
        content: "The world's most advanced free QR code generator. Built for speed, privacy, and full customization."
        image: /images/projects/converter.jpg
        badges:
          - "Utility"
          - "Web Tool"
      - title: "Tiny Tales"
        content: "A heartwarming platform for preserving precious baby memories and milestones."
        image: /images/projects/profile2.jpg
        badges:
          - "Baby Archive"
          - "Memory Storage"

  #Contact
  contact:
    enable: true
    content: "My inbox is always open. Whether you have a question or just want to say hi, I’ll try my best to get back to you!"
    btnName: "Mail me"
    btnLink: "mailto:Sayadmdbayezidhosan@gmail.com"

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: Recent Posts
      enable: true
    socialNetworks:
      github: https://github.com/Sayadbayezid
      linkedin: https://linkedin.com/in/sayadbayezid
      facebook: https://facebook.com/sayadbayezid
      instagram: https://instagram.com/sayadbayezid
      youtube: https://youtube.com/@sayadbayezid

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"
