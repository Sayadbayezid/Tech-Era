baseURL: "https://www.connectwithbayezid.it.com/"
languageCode: "en-us"
title: "Sayad md Bayezid Hosan"
theme: hugo-profile

# Multilingual configuration
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    contentDir: "content"
    menu:
      main:
        - identifier: blog
          name: Blog
          title: Blog posts
          url: /blogs
          weight: 1
        - identifier: gallery
          name: Gallery
          title: Image gallery
          url: /gallery
          weight: 2

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  title: "Sayad md Bayezid Hosan"
  description: "Full-stack Web Developer, Digital Marketer & Tech Provider"
  favicon: "/fav.png"
  useBootstrapCDN: false
  mathjax: false
  animate: true

  navbar:
    align: ms-auto
    brandName: "Bayezid"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Sayad md Bayezid Hosan."
    subtitle: "Full-stack Web Developer & Tech Provider"
    content: "Founder of Connect with Bayezid and GenZ Frontier, specializing in innovative digital ecosystem solutions and AI integration. Based in Bangladesh with 5+ years of experience."
    image: /images/hero.svg
    bottomImage:
      enable: true
    button:
      enable: true
      name: "Get in Touch"
      url: "#contact"
      download: false
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/sayadbayezid
        - icon: fab fa-facebook
          url: https://www.facebook.com/sayadbayezid
        - icon: fab fa-instagram
          url: https://www.instagram.com/freelancer_bayezid0
        - icon: fab fa-youtube
          url: https://youtube.com/@cwbayezid
        - icon: fab fa-behance
          url: https://www.behance.net/syedbayxed/moodboards

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.png"
    content: |-
      As a Full-stack Web Developer, Digital Marketer, and Web Designer, I have built a reputation for delivering innovative digital solutions with 5+ years of experience. My expertise spans the entire digital ecosystem, from web development and AI integration to strategic digital marketing and tech entrepreneurship.

      As a leading Tech Provider, I specialize in permission-based technical solutions and managing digital business assets. I am dedicated to helping my audience navigate digital platforms safely and efficiently by combining academic knowledge with practical technical innovation.

      Professional Background: Founder of Connect with Bayezid and GenZ Frontier. With 2,200+ happy clients worldwide and 98% client retention rate, I have established myself as a trusted tech provider in the global digital ecosystem.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "Full-stack Web Development"
        - "Digital Marketing"
        - "Web Design"
        - "AI Integration"
        - "Tech Entrepreneurship"
        - "Business Asset Management"

  # Experience
  experience:
    enable: true
    items:
      - company: "Connect with Bayezid"
        companyUrl: "https://www.connectwithbayezid.it.com"
        jobs:
          - name: "Founder & Tech Provider"
          - date: "2019 - Present"
            content: "Specializing in permission-based technical solutions and managing digital business assets. Successfully served 2,200+ happy clients worldwide with a 98% client retention rate."
      - company: "GenZ Frontier"
        companyUrl: "http://www.genzfrontir.com"
        jobs:
          - name: "Founder"
          - date: "2021 - Present"
            content: "Focusing on innovative digital ecosystem solutions and AI integration for the modern generation."

  # Education
  education:
    enable: true
    items:
      - title: "Undergraduate Student (English)"
        school:
          name: "Northern University Bangladesh"
          url: "https://nub.ac.bd"
        date: "Expected Graduation: June 2026"
        content: "Department of English - Final-year undergraduate student."

  # Achievements
  achievements:
    enable: true
    items:
      - title: "2,200+ Happy Clients"
        content: "Delivered successful digital solutions to a global clientele with high satisfaction."
        image: /images/achievement.jpg
      - title: "98% Client Retention"
        content: "Built long-term trust and professional relationships with businesses worldwide."
        image: /images/achievement.jpg
      - title: "5+ Years Experience"
        content: "Proven track record in web development, digital marketing, and tech entrepreneurship."
        image: /images/achievement.jpg

  # projects
  projects:
    enable: true
    items:
      - title: "GenZ Frontier"
        content: "An innovative digital ecosystem solution focusing on AI integration and modern tech trends."
        image: /images/projects/profile.png
        badges:
          - "AI Integration"
          - "Digital Ecosystem"
      - title: "Connect with Bayezid"
        content: "A professional platform for tech solutions and digital business asset management."
        image: /images/projects/converter.jpg
        badges:
          - "Tech Provider"
          - "Business Solutions"
      - title: "Personal Portfolio"
        content: "A professional showcase of skills, experience, and digital service offerings."
        image: /images/projects/profile2.jpg
        badges:
          - "Hugo"
          - "Web Design"

  #Contact
  contact:
    enable: true
    content: "Based in Auliabad, Kalihati, Tangail, Bangladesh. My inbox is always open. Whether you have a question or just want to say hi, I’ll try my best to get back to you!"
    btnName: "Mail me"
    btnLink: "mailto:Sayadmdbayezidhosan@gmail.com"

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: Recent Posts
      enable: true
    socialNetworks:
      github: https://github.com/Sayadbayezid
      linkedin: https://www.linkedin.com/in/sayadbayezid
      facebook: https://www.facebook.com/sayadbayezid
      instagram: https://www.instagram.com/freelancer_bayezid0
      youtube: https://youtube.com/@cwbayezid

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved © Sayad md Bayezid Hosan"
    emailText: "Check out this site"

  datesFormat:
