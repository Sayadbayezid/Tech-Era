<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Image</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#111;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      font-family:Arial, sans-serif;
    }

    .hero-container{
      width:100%;
      max-width:420px;
      padding:20px;
    }

    .hero-container img{
      width:100%;
      border-radius:20px;
      object-fit:cover;
      display:block;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <img src="Hero.jpeg" alt="Hero Image">
  </div>

</body>
</html>
